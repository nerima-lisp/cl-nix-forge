name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Create the GitHub Release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Non-fatal for the same reason as in ci.yml: a cache is an optimisation,
      # and a release must not be blocked by one being unreachable.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        continue-on-error: true
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The org gate is "the tag equals the version this tree calls itself".
      # Every Common Lisp repository spells that version in its `.asd`;
      # cl-nix-forge ships no `.asd`, so its VERSION file plays the same role
      # (see docs/default.nix, which reads it). Without this step the file and
      # the tag drift apart silently, which is the whole failure the .asd rule
      # exists to prevent.
      - name: Verify tag matches VERSION
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with VERSION ($file)" >&2
            exit 1
          fi

      # Never publish a release that does not pass its own test suite. This
      # builds every check, not just evaluates them: a missing module argument
      # is a lazy error that passes `--no-build` and only fails at build time,
      # which is exactly how six checks were once green in evaluation and red
      # in CI.
      - name: Verify the tagged tree
        run: nix flake check --print-build-logs

      # Creates the release as an empty draft. This workflow does not produce a
      # release body at all.
      #
      # As of the 2026-08-01 revision the GitHub Release description is the only
      # canonical changelog in this org; there is no CHANGELOG.md to read from.
      # See RELEASE_STANDARD.md. After this job goes green the maintainer fills
      # the body in and publishes:
      #
      #   gh release edit "$GITHUB_REF_NAME" --notes-file <file> --draft=false
      #
      # `draft: true` is load-bearing. Publishing straight away would make "the
      # maintainer forgot the notes" a user-visible state. A draft appears
      # neither under "Latest release" nor in the default output of
      # `gh release list`, so an unfinished release never reaches downstream.
      - name: Create draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
